---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: blueox-os
# description will be included in the image's metadata
description: Silverblue with personal customizations

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44 # latest is also supported if you want new updates ASAP
alt-tags:
  - latest
  - redux

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/faugus/faugus-launcher/repo/fedora-%OS_VERSION%/faugus-faugus-launcher-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
      # - https://copr.fedorainfracloud.org/coprs/patrickl/winetricks/repo/fedora-%OS_VERSION%/patrickl-winetricks-fedora-%OS_VERSION%.repo
    install:
      - acpica-tools
      # Common CLI tools for Codex, Claude Code, and interactive development.
      - bat
      # Filesystem creation, checking, and repair tools.
      - btrfs-progs
      - cargo
      - cmake
      - conda
      - coolercontrol
      - curl
      - ddcutil
      - dosfstools
      - edid-decode
      - edk2-ovmf
      - eza
      - exfatprogs
      - faugus-launcher
      - fd-find
      - fzf
      - gcc
      - gcc-c++
      - git
      - git-delta
      - glib2
      - gh
      - gnome-tweaks
      - gparted
      - gtkpod
      - gvfs
      - hplip-common
      - hplip-gui
      - hplip-libs
      - htop
      - ifuse
      - iotop-c
      - jq
      - just
      - libappindicator
      - libappindicator-gtk3
      - libimobiledevice
      - libportal-gtk3
      - lsof
      - monitor-edid
      - make
      - mtools
      - nethogs
      - nodejs
      - ntfs-3g
      - openssl-devel
      - podman-docker
      - podman-compose
      - powertop
      - pyproject-rpm-macros
      - python3-devel
      - python3-gpg
      - python3-setuptools
      - pkgconf-pkg-config
      - qdirstat
      - qemu-img
      - qemu-system-x86
      - qt6-qtbase
      - qt6-qtbase-common
      - qt6-qtbase-gui
      - qt6-qtbase-devel
      - qt6-qtmultimedia
      - qt6-qtmultimedia-devel
      - rocm-hip
      - rocm-opencl
      - rocm-smi
      - rocminfo
      - rust
      - ruby
      - ruby-devel
      - rubygem-bundler
      - ripgrep
      - rpm-build
      - rsync
      - samba
      - shellcheck
      - shfmt
      - strace
      - sudo
      - syncthing
      - systemd-rpm-macros
      - tmux
      - tree
      - unzip
      - v4l-utils
      - vkBasalt
      - wayland-utils
      - wine
      - wtype
      - xorriso
      - yq
      - zip
      - zoxide
      - kernel-devel

  # Proton distributes its Fedora repository as a release RPM. Keep this URL
  # in sync with image-version above when rebasing to another Fedora release.
  - type: rpm-ostree
    install:
      - https://repo.protonvpn.com/fedora-44-stable/protonvpn-stable-release/protonvpn-stable-release-1.0.4-1.noarch.rpm

  # This runs after the repository-release RPM has added Proton's DNF repo.
  - type: rpm-ostree
    install:
      - proton-vpn-gnome-desktop

    # remove:
      # example: removing firefox (in favor of the flatpak)
      # "firefox" is the main package, "firefox-langpacks" is a dependency
      # - firefox
      # - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: script
    #snippets:
    #  - "rpm-ostree override replace --experimental --from repo=copr:copr.fedorainfracloud.org:patrickl:winetricks winetricks"
    scripts:
      #- install-msi-ec.sh
      - install-dropbox.sh
      - install-vscode.sh
      - install-vscodium.sh
      - install-hardinfo2.sh
      - install-cyberpower-ups.sh
      - install-mcontrolcenter.sh
      - install-msi-mysticlight.sh
      - install-obsbot-camera-control.sh

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: "Flathub (system-wide)"
        install:
          - ca.desrt.dconf-editor
          - com.brave.Browser
          - com.core447.StreamController
          - com.dec05eba.gpu_screen_recorder
          - com.discordapp.Discord
          - com.feaneron.Boatswain
          - com.github.childishgiant.mixer
          - com.github.rajsolai.textsnatcher
          - com.github.tchx84.Flatseal
          - com.gitlab.davem.ClamTk
          - com.heroicgameslauncher.hgl
          - com.mattjakeman.ExtensionManager
          - com.microsoft.Edge
          - com.ranfdev.DistroShelf
          - com.slack.Slack
          - com.spotify.Client
          - com.valvesoftware.Steam
          - eu.betterbird.Betterbird
          - io.github.arunsivaramanneo.GPUViewer
          - io.github.fastrizwaan.WineZGUI
          - io.github.flattool.Warehouse
          - io.github.pwr_solaar.solaar
          - io.github.ungoogled_software.ungoogled_chromium
          - io.missioncenter.MissionCenter
          - it.mijorus.gearlever
          - it.mijorus.whisper
          - org.gnome.Boxes
          - org.gnome.Boxes.Extension.OsinfoDb
          - org.kde.haruna
          - org.localsend.localsend_app
          - org.pulseaudio.pavucontrol
          - org.qbittorrent.qBittorrent
          - us.zoom.Zoom
          - xyz.tytanium.DoorKnocker
        remove:
          - org.mozilla.firefox

  - type: gnome-extensions
    install:
      - 6868  # screenshort-cut
      - 1386  # notification-counter
      - 1460  # vitals
      #- 1484  # do-not-disturb-time
      #- 1674  # topiconsfix
      - 19    # user-themes
      - 258   # notifications-alert-on-user-menu
      - 2929  # battery-time-percentage-compact
      - 307   # dash-to-dock
      - 3795  # notification-timeout
      - 4099  # no-overview
      - 4105  # notification-banner-position
      - 4228  # wireless-hid
      - 4548  # tactile
      - 615   # appindicator-support
      - 6242  # emoji-copy
      #- 6278  # battery-usage-wattmeter
      #- 6325  # control-monitor-brightness-and-volume-with-ddcutil
      - 744   # hide-activities-button
      #- 988   # harddisk-led
      - 6000  # quick-settings-audio-devices-renamer
      #- 6898  # dual-monitor-toggle
      - 1262  # bing-wallpaper-changer
      - 6679  # power-profile-indicator
      - 6583  # auto-power-profile
      - 5362  # wireguard-vpn-extension
      - 5964  # quick-settings-audio-devices-hider
      - 1183  # utcclock
      - 3733  # tiling-assistant
      - 3928  # auto-select-headset
      - 8261  # simpleweather
      - 2645  # brightness-control-using-ddcutil

  # - type: initramfs
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
