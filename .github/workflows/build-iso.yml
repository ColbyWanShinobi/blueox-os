name: Build Redux installer ISO

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published BlueOx image tag to install"
        required: true
        default: redux
        type: string
      release_tag:
        description: "GitHub Release tag (leave empty for artifact-only)"
        required: false
        type: string

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create a release only when release_tag is provided
      packages: read
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/blueox-os:${{ inputs.image_tag }}
      BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest
    steps:
      - name: Validate inputs and prepare environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.image_tag }}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            [[ "${{ inputs.release_tag }}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          fi
          echo "IMAGE_REF=${IMAGE_REF,,}" >> "$GITHUB_ENV"
          echo "OWNER=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create ISO configuration
        shell: bash
        run: |
          set -euo pipefail
          sed "s|IMAGE_REFERENCE|${IMAGE_REF}|g" disk_config/iso.toml > "$RUNNER_TEMP/iso.toml"

      - name: Build installer ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ runner.temp }}/iso.toml
          image: ${{ env.IMAGE_REF }}
          chown: ${{ env.UID }}:${{ env.GID }}
          rootfs: btrfs
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Create checksums
        id: checksum
        shell: bash
        env:
          ISO_PATH: ${{ steps.build.outputs.anaconda-iso-output-path }}
          OUTPUT_DIRECTORY: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          if [[ -z "$ISO_PATH" || ! -f "$ISO_PATH" ]]; then
            echo "::error::The ISO builder did not report a readable ISO at '$ISO_PATH'."
            find "$OUTPUT_DIRECTORY" -maxdepth 4 -type f -printf '%p\n' || true
            exit 1
          fi

          iso_name="$(basename "$ISO_PATH")"
          sha256sum "$ISO_PATH" | sed "s|  .*|  $iso_name|" > "$OUTPUT_DIRECTORY/SHA256SUMS"
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueox-redux-${{ inputs.image_tag }}-installer
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          OUTPUT_DIRECTORY: ${{ steps.build.outputs.output-directory }}
          ISO_PATH: ${{ steps.checksum.outputs.iso_path }}
          PACKAGE_URL: https://github.com/${{ github.repository }}/pkgs/container/blueox-os
        shell: bash
        run: |
          set -euo pipefail
          release_notes="$(cat <<EOF
          Installer ISO for [\`${IMAGE_REF}\`](${PACKAGE_URL}).

          The ISO and \`SHA256SUMS\` below are release assets. Verify the download with \`sha256sum -c SHA256SUMS\` before flashing it. The installed system follows the referenced signed container image; its package page is linked above.
          EOF
          )"
          gh release create "$RELEASE_TAG" "$ISO_PATH" "$OUTPUT_DIRECTORY"/SHA256SUMS \
            --title "BlueOx OS ${RELEASE_TAG}" \
            --notes "$release_notes"
