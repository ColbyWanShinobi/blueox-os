name: Build Redux image
on:
  schedule:
    - cron: "00 06 * * *" # build at 06:00 UTC every day
                          # (20 minutes after last ublue images start building)
  push:
    # These are the repository inputs that affect the published Redux image.
    # The daily schedule still catches updates to the upstream base image.
    paths:
      - recipes/redux.yml
      - cosign.pub
      - files/system/**
      - files/scripts/install-cyberpower-ups.sh
      - files/scripts/install-dropbox.sh
      - files/scripts/install-hardinfo2.sh
      - files/scripts/install-mcontrolcenter.sh
      - files/scripts/install-vscode.sh
      - files/scripts/install-vscodium.sh

  pull_request:
    paths:
      - recipes/redux.yml
      - cosign.pub
      - files/system/**
      - files/scripts/install-cyberpower-ups.sh
      - files/scripts/install-dropbox.sh
      - files/scripts/install-hardinfo2.sh
      - files/scripts/install-mcontrolcenter.sh
      - files/scripts/install-vscode.sh
      - files/scripts/install-vscodium.sh
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: build-redux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build and publish Redux image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          #- plasma.yml
          #- gnome-recipe.yml
          #- kde-nvidia-recipe.yml
          #- gnome-nvidia-recipe.yml
          - redux.yml
          #- blueox.yml
          #- blueox-41.yml
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The build is fully handled by the reusable GitHub Action.
      - name: Build Custom Image
        id: build-image
        uses: blue-build/github-action@v1.10
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # PRs validate the recipe without publishing a package or release tag.
          push: ${{ github.event_name != 'pull_request' }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
      - name: Publish build summary
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/blueox-os:redux"
          image="${image,,}"
          {
            echo "## Redux image"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "Recipe validation build completed; no image was published for this pull request."
            else
              echo "Published signed image: \`$image\`"
              echo
              echo "\`rpm-ostree rebase ostree-image-signed:docker://$image\`"
              echo
              echo "Use the **Build Redux installer ISO** workflow to create install media from this tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
